[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrg"
version = "0.3.0"
description = "Quant research data cleaning & governance standard library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qrg = "qrg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qrg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


